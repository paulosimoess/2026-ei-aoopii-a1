<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Face Filters</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-shell">
    <main class="studio-main">
      <section class="viewer-stage">
        <div class="viewer-frame">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="threeCanvas"></canvas>
          <canvas id="canvas"></canvas>
          <div id="status" class="status-pill">A iniciar webcam...</div>
        </div>
      </section>
    </main>

    <aside class="studio-sidebar">
      <div class="brand-block">
        <p class="brand-tag">AR Filters</p>
        <h1>Face Filters</h1>
        <p class="brand-subtitle">
          Aplica, ajusta e captura filtros faciais em tempo real.
        </p>
      </div>

      <section class="panel-card">
        <div class="panel-header">
          <h2>Categorias</h2>
        </div>

        <div id="filtersCategories" class="sidebar-categories"></div>
      </section>

      <section class="panel-card filters-panel">
        <div class="panel-header">
          <h2>Filtros</h2>
        </div>

        <div id="filtersCatalog" class="filters-sidebar-list"></div>
      </section>

      <section class="panel-card">
        <div class="panel-header">
          <h2>Ajustar filtro</h2>
        </div>

        <div id="filterAdjustPanel" class="filter-adjust-panel">
          <p class="adjust-placeholder">
            Seleciona um filtro para ajustar tamanho, posição e rotação.
          </p>
        </div>
      </section>

      <section class="panel-card">
        <div class="panel-header">
          <h2>Controlos</h2>
        </div>

        <div class="panel-actions horizontal-actions">
          <button id="cameraToggleBtn" class="panel-btn">
            Ligar câmara
          </button>

          <button id="landmarksToggleBtn" class="panel-btn panel-btn-secondary">
            Ocultar landmarks
          </button>
        </div>
      </section>

      <section class="panel-card preview-panel">
        <div class="panel-header">
          <h2>Fotografia</h2>
        </div>

        <div class="panel-actions horizontal-actions photo-actions">
          <button id="capturePhotoBtn" class="panel-btn">
            Tirar foto
          </button>

          <button id="downloadPhotoTopBtn" class="panel-btn panel-btn-secondary" disabled>
            Transferir imagem
          </button>
        </div>

        <img id="photoPreview" class="photo-preview" alt="Foto capturada" />

        <p id="photoMessage" class="photo-message">
          Ainda não foi capturada nenhuma foto.
        </p>
      </section>
    </aside>
  </div>

  <div id="photoModal" class="photo-modal hidden">
    <div class="photo-modal-content">
      <button id="closePhotoModalBtn" class="photo-modal-close">×</button>
      <img id="photoModalImage" class="photo-modal-image" alt="Foto capturada ampliada" />
    </div>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
  </script>

  <script type="module" src="app.js"></script>
</body>
</html>
