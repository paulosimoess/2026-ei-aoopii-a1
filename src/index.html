<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Face Filters</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>AR Face Filters</h1>
    <p>Aplicação de filtros faciais em tempo real com webcam.</p>
  </header>

  <main>
    <section class="viewer-section">
      <div class="viewer">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="status" class="status">A iniciar webcam...</div>
      </div>
    </section>

    <section class="controls-section">
      <h2>Filtros</h2>
      <div class="controls">
        <button class="filter-btn active" data-filter="none">Sem filtro</button>
        <button class="filter-btn" data-filter="hat">Chapéu</button>
        <button class="filter-btn" data-filter="glasses">Óculos</button>
        <button class="filter-btn" data-filter="mask">Máscara</button>
      </div>

      <div class="controls extra-controls">
        <button id="cameraToggleBtn" class="filter-btn">Desligar câmara</button>
        <button id="landmarksToggleBtn" class="filter-btn">Ocultar landmarks</button>
      </div>

      <div class="info-box">
        <h3>Estado atual</h3>
        <p id="currentFilter">Filtro selecionado: Sem filtro</p>
        <p>Deteção de rosto e desenho de filtros em tempo real.</p>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
